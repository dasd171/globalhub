name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_HOST_AUTH_METHOD: trust }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/globalhub_test
      TEST_DATABASE_URL_B: postgresql://postgres:postgres@localhost:5432/globalhub_node_b
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/globalhub_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: psql postgresql://postgres:postgres@localhost:5432/postgres -c "create database globalhub_test" -c "create database globalhub_node_b"
      - run: pnpm db:generate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:unit
      - run: pnpm test:integration
      - run: pnpm --filter @globalhub/api build && pnpm --filter @globalhub/worker build
      - run: pnpm --filter @globalhub/web build
      - run: pnpm audit --audit-level=high || true
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/docker/Dockerfile --target api -t globalhub-api .
      - run: docker build -f deploy/docker/Dockerfile --target web -t globalhub-web .
