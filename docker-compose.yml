# Production deployment. Requires a filled-in .env (see .env.example; run `pnpm env:check`).
# Only the reverse proxy is exposed publicly. Postgres, Redis and MinIO stay on the internal network.
name: globalhub
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: globalhub
      POSTGRES_DB: globalhub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U globalhub"], interval: 10s, timeout: 5s, retries: 5 }
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 10s, timeout: 3s, retries: 5 }
    networks: [internal]

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:?set STORAGE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:?set STORAGE_SECRET_KEY}
    volumes: [miniodata:/data]
    networks: [internal]
    profiles: ["minio"]

  migrate:
    build: { context: ., dockerfile: deploy/docker/Dockerfile, target: migrate }
    env_file: .env
    depends_on: { postgres: { condition: service_healthy } }
    networks: [internal]
    restart: "no"

  api:
    build: { context: ., dockerfile: deploy/docker/Dockerfile, target: api }
    env_file: .env
    environment: { NODE_ENV: production, API_PORT: "4000", TRUST_PROXY: "true" }
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    volumes: [uploads:/app/storage]
    restart: unless-stopped
    networks: [internal]

  worker:
    build: { context: ., dockerfile: deploy/docker/Dockerfile, target: worker }
    env_file: .env
    environment: { NODE_ENV: production }
    depends_on:
      api: { condition: service_started }
    restart: unless-stopped
    networks: [internal]

  web:
    build: { context: ., dockerfile: deploy/docker/Dockerfile, target: web }
    environment: { API_INTERNAL_URL: "http://api:4000" }
    depends_on: [api]
    restart: unless-stopped
    networks: [internal]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/nginx/globalhub.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
    depends_on: [web, api]
    networks: [internal]

volumes: { pgdata: {}, redisdata: {}, miniodata: {}, uploads: {} }
networks: { internal: {} }
